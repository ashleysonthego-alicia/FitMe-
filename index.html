<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B8A83">
<title>FitMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#0B8A83;--prd:#075E59;--prl:#D9F2EF;--acc:#F2784B;--bg:#F8E9C9;--stone:#EBD5A8;--std:#C9AE78;--pink:#5b4a2a;
  --ink:#1c2630;--mut:#5d6b78;--line:#e1e6eb;--card:#fff;--soft:#f3f6f8;--ok:#2f7d32;--warn:#8a5a00;--warnbg:#fff3d6}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:#d9e0e6;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.brand,.btn,.pill,.stat b{font-family:Fredoka,Figtree,system-ui,sans-serif}
.app{max-width:460px;height:100vh;height:100dvh;margin:0 auto;background:var(--card);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(20,40,60,.18)}
.top{background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand{font-size:22px;font-weight:700;letter-spacing:.2px;margin-right:auto}
.pill{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:5px 11px;font-size:14px;font-weight:600;white-space:nowrap}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 0 calc(8px + env(safe-area-inset-bottom));flex-shrink:0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 0}
.nav button.on{color:var(--pri)}
.nav svg{width:24px;height:24px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* forms */
h2{font-size:21px;font-weight:600;margin-bottom:2px}
h3{font-size:16px;font-weight:600;margin:18px 0 8px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:500}
.chip.on{background:var(--prl);border-color:var(--pri);color:var(--prd);font-weight:700}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;background:var(--soft);color:var(--ink)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.good{background:var(--prl);color:var(--prd)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;font-size:16px;font-weight:600;margin-top:8px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--prd)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--prd)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost{background:none;color:var(--mut);box-shadow:none;font-weight:500}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 var(--prd);margin-top:0}
.btn.sm.sec{box-shadow:none}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));flex-shrink:0}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--pri);width:22px}
.obhead{background:var(--pri);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 16px;flex-shrink:0}
.obhead h1{font-size:26px;font-weight:700}
.obhead p{opacity:.9;font-size:14px}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.world{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;text-align:center;font-weight:600;font-size:13px;padding-bottom:6px}
.world i{display:block;height:58px;background-size:120px;margin-bottom:5px}
.world.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--prl)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sw{width:34px;height:34px;border-radius:99px;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--pri)}
.avbuild{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.avbuild svg{width:120px;border-radius:16px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pick button{border:2px dashed #b9c3cc;border-radius:14px;background:var(--soft);padding:16px 8px;font-weight:600;font-size:14px}
.pick span{display:block;font-size:26px}
.pick small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.xf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.xf>div{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.xf h4{font-size:13px;font-weight:700;padding:8px 10px;background:var(--prl);color:var(--prd)}
.xf .slot{aspect-ratio:3/4;background:var(--soft);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mut);padding:8px;cursor:pointer}
.xf .slot img{width:calc(100% + 16px);height:calc(100% + 16px);margin:-8px;object-fit:cover}
.xf .btn{margin:8px;width:calc(100% - 16px)}
.photo-prev{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo-prev img{width:72px;height:72px;border-radius:99px;object-fit:cover;border:3px solid var(--pri)}
.tog{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px;margin-bottom:10px}
.tog div{flex:1}.tog b{display:block;font-size:14.5px}.tog span{font-size:12.5px;color:var(--mut)}
.tog input{width:22px;height:22px;accent-color:var(--pri)}

/* path */
.dayhead{padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.dayhead .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dayhead b{font-family:Fredoka,sans-serif;font-size:17px;font-weight:600}
.dayhead span{font-size:13px;color:var(--mut)}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .4s}
.bar i.gold{background:var(--acc)}
.path{flex:1;min-height:0;overflow-y:auto;background-color:var(--bg);background-size:240px 240px;padding:14px 0 26px}
.row{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;transform:translateX(var(--x))}
.stone{width:74px;height:70px;border-radius:46% 54% 52% 48%/56% 47% 53% 44%;background:var(--stone);color:var(--pink);box-shadow:0 6px 0 var(--std),0 9px 10px rgba(0,0,0,.18);display:grid;place-items:center;position:relative;border:3px solid rgba(255,255,255,.55)}
.stone svg{width:32px;height:32px}
.stone.sm{width:54px;height:50px}.stone.sm svg{width:24px;height:24px}
.stone.done{background:var(--pri);color:#fff;box-shadow:0 6px 0 var(--prd),0 9px 10px rgba(0,0,0,.18);border-color:rgba(255,255,255,.3)}
.stone.next{border-color:var(--acc);animation:pulse 1.8s infinite}
.stone.lock{filter:grayscale(.9);opacity:.55}
.stone:active{transform:translateY(3px)}
.ck{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:99px;background:#fff;color:var(--pri);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ck svg{width:15px!important;height:15px!important;stroke-width:3.4}
.lbl{margin-top:9px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.85);color:#2a3440;border-radius:99px;padding:1px 8px}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--std),0 0 0 0 rgba(242,120,75,.5)}50%{box-shadow:0 6px 0 var(--std),0 0 0 11px rgba(242,120,75,0)}}
.div{margin:16px 20px;text-align:center;font-size:12.5px;font-weight:700;color:#2a3440;display:flex;align-items:center;gap:8px}
.div:before,.div:after{content:"";flex:1;border-top:3px dashed rgba(60,70,80,.45)}
.div.week:before,.div.week:after{border-top:4px solid var(--pri)}
.div.month:before,.div.month:after{border-top:5px double var(--acc)}
.div span{background:rgba(255,255,255,.85);border-radius:99px;padding:2px 10px}
.weekbar{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--line);flex-shrink:0}
.weekbar button{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:7px 4px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.weekbar button svg{width:22px;height:22px;color:var(--pri)}
.weekbar button.done{background:var(--prl);border-color:var(--pri);color:var(--prd)}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(15,25,35,.55);z-index:50;display:none;align-items:flex-end}
.sheet-bg.open{display:flex}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:88%;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{text-align:center}
.sheet .big{display:grid;place-items:center;width:72px;height:68px;margin:2px auto 8px;border-radius:46% 54% 52% 48%/56% 47% 53% 44%;background:var(--stone);color:var(--pink)}
.sheet .big svg{width:36px;height:36px}
.sheet p.c{text-align:center;color:var(--mut);font-size:14px;margin-bottom:10px}
.pts{display:table;margin:0 auto 12px;background:#e9f5e1;color:var(--ok);font-weight:700;border-radius:99px;padding:5px 14px;font-size:14px}
.rows>button,.rows>div{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.rows em{font-style:normal;font-size:22px;width:28px;text-align:center}
.rows b{display:block;font-size:14.5px}.rows span{display:block;font-size:12.5px;color:var(--mut)}
.rows u{margin-left:auto;text-decoration:none;color:#9aa6b1;font-size:20px}
table.plan{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
table.plan td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan td:first-child{font-weight:700;white-space:nowrap;width:44px}
table.plan tr.today td{background:var(--prl)}
ul.ck-list{list-style:none;margin-bottom:10px}
ul.ck-list li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center}
ul.ck-list input{width:20px;height:20px;accent-color:var(--pri);flex-shrink:0}
.breath{width:130px;height:130px;border-radius:99px;margin:8px auto 10px;background:var(--prl);border:3px solid var(--pri);display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;color:var(--prd);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.18)}.breath.out{transform:scale(.86);transition-duration:8s}

/* kit */
.kithead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.kithead svg.fox{width:46px;height:46px}
.kithead b{font-family:Fredoka,sans-serif;font-size:18px}.kithead span{display:block;font-size:12.5px;color:var(--mut)}
.chat{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--soft)}
.bub{max-width:84%;padding:10px 13px;border-radius:16px;font-size:15px}
.bub.k{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.bub.u{background:var(--pri);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:6px}
.qr button{border:1.5px solid var(--pri);color:var(--prd);background:var(--prl);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.kitin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-shrink:0}
.kitin input{flex:1;min-width:0;padding:10px 14px;border-radius:99px;border:1.5px solid var(--line);font-size:16px}
.rnd{width:42px;height:42px;border-radius:99px;background:var(--pri);color:#fff;display:grid;place-items:center;flex-shrink:0}
.rnd svg{width:20px;height:20px}.rnd.rec{background:#d62828;animation:pulse 1.2s infinite}
.kitpop{position:absolute;left:10px;right:10px;bottom:76px;z-index:40;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:12px;display:none;gap:10px;border:2px solid var(--pri)}
.kitpop.open{display:flex}
.kitpop .who{flex-shrink:0;width:54px;text-align:center}
.kitpop .who svg,.kitpop .who img{width:54px;height:54px;border-radius:99px;object-fit:cover;background:var(--prl)}
.kitpop p{font-size:14.5px;margin-bottom:8px}
.cheer{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:60;background:#1f2a35;color:#fff;border-radius:99px;padding:6px 16px 6px 6px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:92%}
.cheer.show{opacity:1;transform:translate(-50%,0)}
.cheer svg{width:44px;height:44px;border-radius:99px;background:var(--prl);flex-shrink:0}

/* shop + me */
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:8px 4px;border-radius:10px;font-weight:700;font-size:13px;border:1.5px solid var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;background:#fff}
.item.own{border-color:var(--pri);background:var(--prl)}
.item em{font-style:normal;font-size:32px;display:block}
.item b{display:block;font-size:13.5px}.item span{font-size:12.5px;color:var(--mut);display:block;margin-bottom:6px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.hero svg.av{width:124px;border-radius:18px;flex-shrink:0}
.hero img{width:64px;height:64px;border-radius:99px;object-fit:cover;border:3px solid var(--pri)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:600}.stat span{font-size:11.5px;color:var(--mut)}
.pg{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.pg .r{display:flex;justify-content:space-between;font-weight:600}
.pg p{font-size:12.5px;color:var(--mut);margin-top:6px}
table.earn{width:100%;border-collapse:collapse;font-size:13.5px}
table.earn td{padding:7px 2px;border-bottom:1px solid var(--line)}
table.earn td:last-child{text-align:right;font-weight:700;color:var(--ok);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top" hidden>
    <span class="brand">FitMe</span>
    <span class="pill" id="pill-streak" title="Day streak"></span>
    <button class="pill" id="pill-cur" onclick="go('shop')"></button>
  </header>

  <section class="screen" id="s-onboard" hidden>
    <div class="obhead"><h1>Welcome to FitMe</h1><p>A few questions, then your path begins.</p></div>
    <div class="scroll pad" id="ob-body"></div>
    <div class="dots" id="ob-dots"></div>
  </section>

  <section class="screen" id="s-path" hidden>
    <div class="dayhead" id="dayhead"></div>
    <div class="path" id="path"></div>
    <div class="weekbar" id="weekbar"></div>
  </section>

  <section class="screen" id="s-kit" hidden>
    <div class="kithead"><span id="kit-face"></span><div><b>Kit</b><span>Your FitMe partner. Kit only listens while you hold a conversation here.</span></div></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="kitin">
      <button class="rnd" id="mic" onclick="kitMic()" aria-label="Speak to Kit"></button>
      <input id="kit-inp" placeholder="Talk to Kit" onkeydown="if(event.key==='Enter')kitSend()" aria-label="Message to Kit">
      <button class="rnd" id="send" onclick="kitSend()" aria-label="Send"></button>
    </div>
  </section>

  <section class="screen" id="s-shop" hidden><div class="scroll pad" id="shop"></div></section>
  <section class="screen" id="s-me" hidden><div class="scroll pad" id="me"></div></section>

  <nav class="nav" id="nav" hidden></nav>

  <div class="kitpop" id="kitpop"></div>
  <div class="cheer" id="cheer"></div>
  <div class="sheet-bg" id="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <input type="file" id="pick-gallery" accept="image/*" hidden onchange="onPhoto(this)">
  <input type="file" id="pick-camera" accept="image/*" capture="environment" hidden onchange="onPhoto(this)">
</div>
<script>
'use strict';
/* ================= FitMe — data and artwork ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALLERGIES=['Milk','Eggs','Wheat','Peanuts','Tree Nuts','Soybeans','Sesame','Fish','Shellfish','Vegetarian','Vegan','Diabetes'];
const ACTIVITIES=['Walking','Running','Cycling','Aerobics','Yoga','Pilates','Weights','Strength','Team Sports'];
const TEMPT=['Desserts','Snacks','Fast Foods','Processed Foods','Sodas','Alcohol','Baked Goods','Ice Cream','Sweets','Chips'];
const SKIN=['#FCE1C8','#F3C9A5','#DDA77B','#B97F55','#8D5A3B','#5E3A26'];
const HAIRC=['#2B1B12','#5C3A21','#A0652B','#D9A441','#B23A2B','#9CA3AF'];
const HAIRN=['Short','Long','Bun','Curly','None'];

/* ---------- Worlds: palette, currency, shop ----------
   accessory: [name, emoji, slot, shape, colour]   outfit: [name, emoji, style, top, bottom]   experience: [name, emoji, sky1, sky2] */
const WORLDS={
 beach:{n:'Beach',cur:'shells',ci:'🐚',box:'treasure chest',pri:'#0B8A83',prd:'#075E59',prl:'#D9F2EF',acc:'#F2784B',bg:'#F8E9C9',stone:'#EBD5A8',std:'#C9AE78',pink:'#5b4a2a',
  A:[['Straw Hat','👒','head','brim','#E3B565'],['Sunglasses','🕶️','face','shades','#1f2937'],['Flower Lei','🌺','neck','lei','#E8558F'],['Beach Umbrella','⛱️','hand','emoji'],['Beach Bag','👜','hand','emoji'],['Snorkel Mask','🤿','face','goggles','#19A7CE']],
  O:[['Aloha Shirt','🌺','tee','#E8558F','#2B6CB0'],['Surf Trunks','🩳','tee','#FFD166','#EF476F'],['Sundress','👗','dress','#FF9F1C','#FF9F1C'],['Wetsuit','🤿','suit','#1B2A41','#1B2A41'],['Sailor Stripes','⚓','tee','#F8FAFC','#1D3557'],['Lifeguard Red','🛟','jacket','#D62828','#F8FAFC']],

/* ---------- healthy-pace projection (AHA / NIH style: about 1 to 1.5 lb a week, never below a healthy BMI) ---------- */
const bmiCat=b=>b<18.5?'Underweight':b<25?'Healthy Weight':b<30?'Overweight':'Obese';
function project(lbs,cm,date,p){
 if(!lbs||!cm||!date)return null;
 const days=Math.round((pd(date)-pd(dk()))/864e5);if(days<7)return{err:'Choose a target date at least one week from today.'};
 const weeks=days/7,m=cm/100,bmi=lbs*.453592/(m*m),rate=bmi>=30?1.5:bmi>=25?1:0;
 const floorLbs=22*m*m/.453592;                               // do not project below the middle of the healthy range
 const loss=Math.max(0,Math.min(rate*weeks,lbs*.2,lbs-floorLbs)),newLbs=lbs-loss,newBmi=newLbs*.453592/(m*m);
 const mo=Math.round(weeks/4.345),span=mo>=1?mo+' month'+(mo>1?'s':''):Math.round(weeks)+' weeks';
 let text;
 if(bmi<18.5)text=`Your BMI is ${bmi.toFixed(1)} (Underweight). FitMe will not plan weight loss for you. Your path focuses on nourishing meals and strength, and it is worth talking with your doctor about a healthy weight.`;
 else if(loss<.5)text=`Your BMI is ${bmi.toFixed(1)} (${bmiCat(bmi)}). Over ${span} of healthy eating and regular exercise you can expect to keep a similar weight while getting stronger and more toned.`;
 else text=`Your BMI is ${bmi.toFixed(1)} (${bmiCat(bmi)}). With a healthy diet and regular exercise over ${span}, you could lose about ${wtxt(loss,p)} and reach about ${wtxt(newLbs,p)}, a BMI of ${newBmi.toFixed(1)} (${bmiCat(newBmi)}).`;
 return{bmi,loss,newLbs,newBmi,weeks,span,text};
}

 if(obStep===2)h=`<h2>Allergies and food choices</h2><p class="sub">Your weekly meal plans leave these out. Choose Diabetes to follow American Diabetes Association meal guidance too.</p>${chipsHTML('allergies',ALLERGIES)}

  <label class="tog"><div><b>Allow notifications</b><span>Water reminders, encouragement and check-ins from Kit</span></div><input type="checkbox" ${D.notif?'checked':''} onchange="D.notif=this.checked"></label>

 b.innerHTML=h;b.scrollTop=0;if(obStep===1)reAbout();
 $('ob-dots').innerHTML=[1,2,3,4].map(i=>`<i class="${i===obStep?'on':''}"></i>`).join('')}
function obGo(n){obStep=n;renderOb()}
function obNext(){const e=aboutErr();if(e){cheer(e);return}obGo(2)}
function launch(){const e=aboutErr();if(e){cheer(e);obGo(1);return}
 D.name=(D.name||'').trim()||'Friend';const t=dk();
 if(!D.startDate){D.startDate=t;D.startWeightLbs=D.weightLbs;S.weights=[{d:t,lbs:D.weightLbs}]}
 S.profile=D;S.onboarded=true;S.lastOpen=Date.now();save();

 $('ob-body').innerHTML='';$('s-onboard').hidden=true;enterApp();

/* ================= App shell ================= */
function enterApp(){$('top').hidden=false;$('nav').hidden=false;applyWorld(S.profile.world);
 $('nav').innerHTML=[['path','route','Path'],['kit','chat','Kit'],['shop','bag','Shop'],['me','user','Me']].map(t=>`<button id="nav-${t[0]}" onclick="go('${t[0]}')">${ICON[t[1]]}${t[2]}</button>`).join('');
 $('kit-face').innerHTML=FOX;$('mic').innerHTML=ICON.mic;$('send').innerHTML=ICON.send;go('path')}
function go(t){TAB=t;for(const s of['path','kit','shop','me']){$('s-'+s).hidden=s!==t;$('nav-'+s).classList.toggle('on',s===t)}refresh();if(t==='kit')kitOpen()}
function refresh(){if(!S.onboarded)return;
 $('pill-streak').textContent='🔥 '+streaks().streak;$('pill-cur').textContent=W().ci+' '+num(S.points);$('pill-cur').setAttribute('aria-label',num(S.points)+' '+cur()+', open shop');
 if(TAB==='path')renderPath();if(TAB==='shop')renderShop();if(TAB==='me')renderMe()}

/* ================= Path ================= */
const SEQ=['stretch','w1','breakfast','avoid-b','w2','breathe-1','lunch','breathe-2','avoid-l','w3','exercise','w4','w5','snack','avoid-s','w6','dinner','avoid-d','walk','w7','w8'];
const WATER=SEQ.filter(x=>/^w\d$/.test(x));
function info(id){
 if(id==='plan')return{type:'plan',icon:'plan',label:'Meal plan'};
 if(/^w\d$/.test(id))return{type:'water',icon:'water',label:'Water'};
 if(id.startsWith('avoid'))return{type:'avoid',icon:'avoid',label:'I avoided'};
 if(id.startsWith('breathe'))return{type:'breathe',icon:'breathe',label:'Breathe'};
 const m={stretch:['stretch','stretch','Stretch'],breakfast:['meal','meal','Breakfast'],lunch:['meal','meal','Lunch'],dinner:['meal','meal','Dinner'],snack:['meal','cookie','Snack'],exercise:['exercise','barbell','Exercise'],walk:['walk','walk','Walk']}[id];
 return{type:m[0],icon:m[1],label:m[2]}}
const dayRec=k=>S.days[k]||(S.days[k]={done:{},pts:0});
const weekRec=k=>S.weeks[wk(k)]||(S.weeks[wk(k)]={});
const doneCount=k=>{const r=S.days[k];return r?SEQ.filter(x=>r.done[x]!=null).length:0};
const pct=k=>doneCount(k)/SEQ.length;
function streaks(){const t=dk(),act=k=>S.days[k]&&Object.keys(S.days[k].done).length>0,big=k=>S.days[k]&&S.days[k].pts>=150;
 const run=f=>{let n=0,k=f(t)?t:addDays(t,-1);while(f(k)){n++;k=addDays(k,-1)}return n};
 return{used:Object.keys(S.days).filter(act).length,streak:run(act),progress:run(big)}}
const OFF=[0,46,70,46,0,-46,-70,-46];
function stone(id,st,i,lock){const f=info(id);
 return `<div class="row" style="--x:${OFF[i%8]}px"><button class="stone ${f.type==='water'?'sm':''} ${st}" onclick="tapStep('${id}',${lock?1:0})" aria-label="${f.label}${st==='done'?', done':lock?', opens tomorrow':''}">${ICON[f.icon]}${st==='done'?'<i class="ck">'+ICON.check+'</i>':''}</button><span class="lbl">${f.label}</span></div>`}
function renderPath(){const t=dk(),r=dayRec(t),w=weekRec(t),p=S.profile,dayN=Math.round((pd(t)-pd(p.startDate||t))/864e5)+1,n=doneCount(t);
 $('dayhead').innerHTML=`<div class="r"><b>Day ${dayN}, ${fmt(t,{weekday:'long'})}</b><span>${fmt(t,{month:'short',day:'numeric'})} in ${W().n} world</span></div><div class="bar"><i style="width:${Math.round(n/SEQ.length*100)}%"></i></div><div class="r" style="margin-top:4px"><span>${n} of ${SEQ.length} steps today</span><span>${W().ci} ${r.pts} earned today</span></div>`;
 const ids=(w.plan&&r.done.plan==null?[]:['plan']).concat(SEQ);let seenNext=false,h=`<div class="div"><span>Today</span></div>`;
 ids.forEach((id,i)=>{const done=id==='plan'?!!w.plan:r.done[id]!=null;let st=done?'done':'';if(!done&&!seenNext){st='next';seenNext=true}h+=stone(id,st,i,0)});
 h+=`<div class="div"><span>End of ${fmt(t,{weekday:'long'})}</span></div>`;
 if(dow(t)===6)h+=`<div class="div week"><span>End of week ${Math.floor((dayN-1)/7)+1}</span></div>`;
 const tm=addDays(t,1);if(pd(tm).getMonth()!==pd(t).getMonth())h+=`<div class="div month"><span>End of ${fmt(t,{month:'long'})}</span></div>`;
 h+=`<div class="div"><span>Tomorrow, ${fmt(tm,{weekday:'long'})}</span></div>`;
 (dow(tm)===0?['plan']:[]).concat(SEQ.slice(0,6)).forEach((id,i)=>h+=stone(id,'lock',i+ids.length,1));
 const sc=$('path').scrollTop;$('path').innerHTML=h;$('path').scrollTop=sc;
 $('weekbar').innerHTML=[['plan','plan','Meal plan'],['stock','cart','Stock up'],['prep','pot','Meal prep']].map(b=>`<button class="${w[b[0]]?'done':''}" onclick="weekly('${b[0]}')">${ICON[b[1]]}${b[2]}${w[b[0]]?' ✓':''}</button>`).join('')}
function tapStep(id,lock){
 if(lock){cheer('That step opens tomorrow. Today\'s steps are above.');return}
 if(id==='plan'){weekly('plan');return}
 if(info(id).type==='water'&&dayRec(dk()).done[id]==null){complete(id,3,'Water logged.','water');return}
 openStep(id)}
function complete(id,pts,msg,hand){const k=dk(),r=dayRec(k);if(r.done[id]!=null)return;
 const first=!Object.keys(r.done).length;r.done[id]=pts;const tot=pts+(first?1:0);S.points+=tot;S.lifetime+=tot;r.pts+=tot;S.stats.steps++;save();closeSheet();refresh();
 cheer(`${msg} +${pts} ${cur()}${first?', plus 1 for showing up today':''}`,hand);
 const p=pct(k);
 if(p>=.75&&!r.chest){r.chest=1;save();setTimeout(()=>sheet(`<div style="width:150px;margin:0 auto 8px">${avatarSVG({id:'r'})}</div><h2>Your ${W().box} is open</h2><p class="c">You finished three quarters of today's steps. Everything you earned today is ready to spend in the shop.</p><div class="pts">${W().ci} ${num(S.points)} ${cur()}</div><button class="btn" onclick="closeSheet();go('shop')">Visit the shop</button><button class="btn ghost" onclick="closeSheet()">Keep going</button>`),1200)}
 else if(p>=.8&&IMG.photo&&!r.nudge){r.nudge=1;save();setTimeout(()=>kitPop('You have finished over 80% of today. Days like this are what your progress picture is built on. Want to refresh it?',[['See my picture',"go('me')"]]),1500)}}

/* ---------- step sheets ---------- */
const MK={breakfast:'b',lunch:'l',dinner:'d',snack:'s'};
function openStep(id){const f=info(id),r=dayRec(dk()),big=`<div class="big">${ICON[f.icon]}</div>`,C=cur(),T=S.profile.temptations;
 if(r.done[id]!=null){sheet(`${big}<h2>${f.label}</h2><p class="c">Completed today.</p><div class="pts">+${r.done[id]} ${C}</div><button class="btn sec" onclick="closeSheet()">Close</button>`);return}
 let h='';
 if(f.type==='meal'){const m=MEALBY[mealsFor(dk())[MK[id]][dow(dk())]];
  h=`${big}<h2>${f.label}</h2><p class="c">On your plan for today</p><div class="note good"><b>${m.n}</b><br>${m.i.join(', ')}</div>${S.profile.allergies.includes('Diabetes')?'<div class="note">Plate method: half non-starchy vegetables, a quarter lean protein, a quarter quality carbohydrates.</div>':''}<div class="pts">+15 ${C}</div><button class="btn" onclick="complete('${id}',15,'Healthy ${f.label.toLowerCase()} logged.')">I ate a healthy ${f.label.toLowerCase()}</button>`}
 if(f.type==='avoid'){const list=T.length?T:['Sugar','Processed food','Alcohol','Other'];AVSEL=[];
  h=`${big}<h2>I avoided a temptation</h2><p class="c">What did you pass up?</p><div class="chips" style="justify-content:center">${list.map((x,i)=>`<button class="chip" onclick="avTg(${i},this)">${x}</button>`).join('')}</div><div class="pts">+10 ${C}</div><button class="btn" onclick="avDone('${id}')">Mark as avoided</button>`}
 if(f.type==='stretch')h=`${big}<h2>Morning stretch</h2><p class="c">Neck rolls, shoulder circles, a standing side bend, a hamstring reach and a calf stretch. Move gently and breathe.</p><button class="btn" onclick="complete('stretch',5,'Stretch done.')">I stretched for 5 minutes, +5 ${C}</button><button class="btn" onclick="complete('stretch',10,'Stretch done.')">I stretched for 10 minutes, +10 ${C}</button>`;
 if(f.type==='exercise'){const x=todayEx(dk());
  h=`${big}<h2>${x.n}</h2><p class="c">${x.kind} day. Across the week your plan mixes aerobic activity with strength work, following American Heart Association and Harvard Medical School guidance.</p>${[10,20,30].map(n=>`<button class="btn" onclick="complete('exercise',${n*2},'Exercise logged.')">${n} minutes, +${n*2} ${C}</button>`).join('')}`}
 if(f.type==='walk')h=`${big}<h2>Walk after a meal</h2><p class="c">Ten to fifteen easy minutes helps digestion and steadies blood sugar.</p><div class="pts">+10 ${C}</div><button class="btn" onclick="complete('walk',10,'Walk logged.')">I took a walk</button>`;
 if(f.type==='breathe')h=`${big}<h2>4-7-8 breathing</h2><p class="c">Breathe in for 4, hold for 7, out for 8. You earn 1 ${C.replace(/s$/,'')} for each full minute.</p><div class="breath" id="breath">Ready</div><p class="c" id="breath-t">0:00</p><button class="btn" id="breath-go" onclick="startBreath()">Start</button><button class="btn sec" onclick="endBreath('${id}')">Finish and collect</button>`;
 sheet(h+`<button class="btn ghost" onclick="closeSheet()">Close</button>`)}
let AVSEL=[];
function avTg(i,el){const at=AVSEL.indexOf(i);at<0?AVSEL.push(i):AVSEL.splice(at,1);el.classList.toggle('on')}
function avDone(id){if(!AVSEL.length){cheer('Choose what you avoided.');return}complete(id,10,'Temptation avoided.')}
let brT=null,brS=0;
function startBreath(){if(brT)return;$('breath-go').disabled=true;const tick=()=>{const b=$('breath');if(!b){stopBreath();return}const ph=brS%19;b.textContent=ph<4?'Breathe in':ph<11?'Hold':'Breathe out';b.className='breath '+(ph<11?'in':'out');$('breath-t').textContent=Math.floor(brS/60)+':'+String(brS%60).padStart(2,'0');brS++};brS=0;tick();brT=setInterval(tick,1000)}
function stopBreath(){clearInterval(brT);brT=null}
function endBreath(id){const m=Math.floor(brS/60);if(m<1){cheer('Breathe for at least one full minute to collect.');return}stopBreath();brS=0;complete(id,m,'Breathing done.')}
const AER=['Walking','Running','Cycling','Aerobics','Team Sports'],STR=['Weights','Strength','Pilates','Yoga'];
function todayEx(k){const a=S.profile.activities,ae=a.filter(x=>AER.includes(x)),st=a.filter(x=>STR.includes(x)),i=dow(k),A=ae.length?ae:['Brisk walking'],B=st.length?st:['Bodyweight strength'];
 return i%2===0?{n:A[(i/2)%A.length],kind:'Aerobic'}:{n:B[((i-1)/2)%B.length],kind:'Strength and flexibility'}}

/* ---------- weekly meal plan, shopping list, meal prep ---------- */
function allowed(m){const al=S.profile.allergies,ex=new Set();al.forEach(a=>(ATAG[a]||[]).forEach(t=>ex.add(t)));return!m.t.some(t=>ex.has(t))&&!(al.includes('Diabetes')&&m.hc)}
function mealsFor(k){const w=weekRec(k),sig=S.profile.allergies.slice().sort().join('|');
 if(!w.meals||w.sig!==sig){const off=Math.round(pd(wk(k))/6048e5),o={};for(const t in MEALS){const ok=MEALS[t].filter(allowed);o[t]=DAYN.map((_,i)=>ok[(i+off)%ok.length].n)}w.meals=o;w.sig=sig;save()}
 return w.meals}
function weekly(kind){const t=dk(),w=weekRec(t),m=mealsFor(t),C=cur(),done=!!w[kind];let h='';
 if(kind==='plan'){h=`<div class="big">${ICON.plan}</div><h2>This week's meal plan</h2><p class="c">Built on American Heart Association guidance${S.profile.allergies.includes('Diabetes')?' and American Diabetes Association meal planning':''}${S.profile.allergies.filter(a=>a!=='Diabetes').length?', and following your food choices: '+S.profile.allergies.filter(a=>a!=='Diabetes').join(', '):''}.</p><table class="plan">${DAYN.map((d,i)=>`<tr class="${i===dow(t)?'today':''}"><td>${d}</td><td>${['b','l','d','s'].map(x=>m[x][i]).join('<br>')}</td></tr>`).join('')}</table><div class="note">Always check food labels for your allergens.</div>`}
 else{if(!w.plan){sheet(`<div class="big">${ICON.plan}</div><h2>Make your meal plan first</h2><p class="c">Your shopping list and prep guide come from this week's meal plan.</p><button class="btn" onclick="weekly('plan')">Open the meal plan</button><button class="btn ghost" onclick="closeSheet()">Close</button>`);return}
  const all=[];for(const x in m)m[x].forEach(n=>all.push(MEALBY[n]));
  if(kind==='stock'){const c={};all.forEach(x=>x.i.forEach(g=>c[g]=(c[g]||0)+1));
   h=`<div class="big">${ICON.cart}</div><h2>Stock up</h2><p class="c">Everything for this week's meals. The number shows how many meals use it.</p><ul class="ck-list">${Object.keys(c).sort().map(g=>`<li><input type="checkbox" aria-label="${g}"><span>${g[0].toUpperCase()+g.slice(1)}</span><span style="margin-left:auto;color:var(--mut)">${c[g]}</span></li>`).join('')}</ul>`}
  else{const ps=[...new Set(all.map(x=>x.p).filter(Boolean))];
   h=`<div class="big">${ICON.pot}</div><h2>Meal prep</h2><p class="c">Do these ahead and the week's meals come together quickly.</p><ul class="ck-list">${ps.map(g=>`<li><input type="checkbox" aria-label="${g}"><span>${g}</span></li>`).join('')}</ul>`}}
 h+=done?`<div class="pts">Done this week, +20 ${C}</div>`:`<button class="btn" onclick="weekDone('${kind}')">${{plan:'Use this plan',stock:'Shopping is done',prep:'Prep is done'}[kind]}, +20 ${C}</button>`;
 sheet(h+`<button class="btn ghost" onclick="closeSheet()">Close</button>`)}
function weekDone(kind){const w=weekRec(dk());if(w[kind])return;w[kind]=1;complete(kind==='plan'?'plan':'wk-'+kind,20,{plan:'Meal plan set.',stock:'Kitchen stocked.',prep:'Meal prep done.'}[kind])}

let shopCat='A';
function renderShop(){const w=W(),wid=S.profile.world,c=CAT[shopCat];
 $('shop').innerHTML=`<h2>${w.n} shop</h2><p class="sub">Your ${w.box} holds ${w.ci} ${num(S.points)} ${w.cur}.</p>
 <div class="tabs">${Object.keys(CAT).map(k=>`<button class="${k===shopCat?'on':''}" onclick="shopCat='${k}';renderShop()">${CAT[k].n}</button>`).join('')}</div>
 <p class="sub">${c.n} cost ${num(c.cost)} ${w.cur} each. ${shopCat==='E'?'An experience becomes the scene behind your avatar.':'What you buy appears on your avatar.'}</p>
 <div class="items">${w[shopCat].map((it,i)=>{const id=wid+'-'+shopCat+'-'+i,own=S.owned.includes(id),on=S.equipped[slotOf(id)]===id;
  return `<div class="item ${own?'own':''}"><em>${it[1]}</em><b>${it[0]}</b><span>${own?'Owned':w.ci+' '+num(c.cost)}</span><button class="btn sm ${own&&on?'sec':''}" onclick="${own?'wear':'buy'}('${id}')">${own?(on?'Take off':shopCat==='E'?'Use scene':'Wear'):'Buy'}</button></div>`}).join('')}</div>`}
function buy(id){const cost=CAT[id.split('-')[1]].cost,it=findItem(id);if(S.owned.includes(id))return;
 if(S.points<cost){cheer(`You need ${num(cost-S.points)} more ${cur()} for the ${it[0]}.`);return}

/* ================= Me ================= */
function renderMe(){const p=S.profile,w=W(),t=dk(),r=dayRec(t),st=streaks(),pr=project(p.weightLbs,p.heightCm,p.targetDate),ch=p.startWeightLbs-p.weightLbs,wat=WATER.filter(x=>r.done[x]!=null).length,C=w.cur;
 $('me').innerHTML=`<div class="hero">${avatarSVG({id:'m'})}<div><h2>${esc(p.name)}</h2><p class="sub">${w.n} world, since ${fmt(p.startDate,{month:'short',day:'numeric'})}</p>${IMG.avatar?`<img src="${IMG.avatar}" alt="Your life-like avatar" onclick="viewImg('avatar')"><br>`:''}<button class="btn sm sec" onclick="settings()">Settings</button></div></div>
 <div class="stats"><div class="stat"><b>${st.used}</b><span>Days of use</span></div><div class="stat"><b>${st.streak}</b><span>Day streak</span></div><div class="stat"><b>${st.progress}</b><span>Progress streak</span></div></div>
 <h3>Today</h3>

 <h3>My transformation</h3><div id="photo-host">${photoHTML()}</div>
 <h3>How you earn ${C}</h3><table class="earn">${[['Healthy meal or snack',15],['Avoiding a temptation',10],['Each glass of water, 8 a day',3],['Walk after a meal',10],['Exercise, per 10 minutes',20],['Stretching, per 5 minutes',5],['4-7-8 breathing, per minute',1],['Meal plan, stock up, meal prep, weekly',20],['First step of the day',1]].map(x=>`<tr><td>${x[0]}</td><td>+${x[1]} ${w.ci}</td></tr>`).join('')}</table>`}
function weighIn(){const im=imp();sheet(`<h2>Log today's weight</h2><p class="c">Weekly weigh-ins are plenty. Day-to-day changes are mostly water.</p><div class="fld"><label for="wi">Weight (${im?'lbs':'kg'})</label><input id="wi" type="number" inputmode="decimal"></div><button class="btn" onclick="saveWeigh()">Save weight</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>`)}
function saveWeigh(){let v=parseFloat($('wi').value)||0;if(!imp())v*=2.20462;if(!(v>=60&&v<=700)){cheer('Enter your weight.');return}
 S.profile.weightLbs=v;S.weights=S.weights.filter(x=>x.d!==dk());S.weights.push({d:dk(),lbs:v});save();closeSheet();refresh();cheer('Weight saved.')}

/* ================= Photo, progress picture, life-like avatar ================= */
const GENLBL={prog:'Create progress picture',avatar:'Create life-like avatar'};
const slotHTML=k=>IMG[k]?`<img src="${IMG[k]}" alt="${k==='prog'?'Your progress picture':'Your life-like avatar'}">`:(k==='prog'?'A realistic picture of you at your target date':'A cartoon portrait made from your picture');
function photoHTML(ob){
 const pick=`<div class="pick"><button onclick="$('pick-gallery').click()"><span>🖼️</span>Choose from gallery<small>Use a photo you already have</small></button><button onclick="$('pick-camera').click()"><span>📷</span>Take a photo<small>Open your camera</small></button></div>`;
 const priv=`<div class="note">Your photo stays on this device. It is sent only to Stability AI, and only when you tap Create. Fully dressed photos only: no nude or suggestive images.</div>`;
 if(!IMG.photo)return pick+priv;
 return `<div class="photo-prev"><img src="${IMG.photo}" alt="Your photo"><div><b>Photo saved</b><br><button class="btn sm sec" onclick="$('pick-gallery').click()">Change</button> <button class="btn sm sec" onclick="$('pick-camera').click()">Retake</button> <button class="btn sm sec" onclick="dropPhoto()">Remove</button></div></div>
 <div class="xf"><div><h4>Progress picture</h4><div class="slot" onclick="viewImg('prog')">${slotHTML('prog')}</div><button class="btn sm gen-prog" onclick="gen('prog')">${IMG.prog?'Create again':'Create'}</button></div>
 <div><h4>Life-like avatar</h4><div class="slot" onclick="viewImg('avatar')">${slotHTML('avatar')}</div><button class="btn sm gen-avatar" onclick="gen('avatar')">${IMG.avatar?'Create again':'Create'}</button></div></div>${priv}`}
function refreshPhoto(){const h=$('photo-host');if(h)h.innerHTML=photoHTML();if(!S.onboarded&&obStep===4)renderOb();else if(TAB==='me'&&S.onboarded)renderMe()}
function onPhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!f.type.startsWith('image/')){cheer('Choose an image file.');return}
 const url=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{setImg('photo',scaled(im,1024,.88));setImg('prog',null);setImg('avatar',null);URL.revokeObjectURL(url);refreshPhoto();cheer('Photo saved on this device.')};
 im.onerror=()=>cheer('That image could not be read. Try another one.');im.src=url}
function scaled(im,max,q){const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
const shrink=src=>new Promise(res=>{const im=new Image();im.onload=()=>res(scaled(im,768,.85));im.onerror=()=>res(src);im.src=src});
function dropPhoto(){for(const k in IMG)setImg(k,null);refreshPhoto()}
function progPrompt(){const p=P(),pr=project(p.weightLbs,p.heightCm,p.targetDate)||{},loss=Math.round(pr.loss||0);
 return `Realistic photograph of the same person in the same pose, setting and clothing, fully dressed, after ${pr.span||'several months'} of moderate healthy eating and regular exercise. `+(loss>=1?`They have lost about ${loss} pounds: a modestly slimmer waist and face and slightly more muscle tone.`:`Their weight is about the same, with slightly better posture and muscle tone.`)+` Keep the face, age, skin tone, hair and identity exactly the same. The change is believable and moderate, not dramatic. Natural lighting, true-to-life photo.`}
function avatarPrompt(){const worn=Object.values(S.equipped).filter(Boolean).map(id=>findItem(id)[0]);
 return `Friendly cartoon portrait of this same person in a polished modern animated-film style, keeping their face shape, skin tone, hair and age recognisable. Warm smile, fully dressed in casual clothes${worn.length?', wearing or holding: '+worn.join(', '):''}. Simple ${W().n.toLowerCase()}-themed background. Clean, colourful, detailed character illustration.`}
let busy=false;
async function gen(kind){
 if(!IMG.photo){cheer('Add a photo first.');return}if(!APIKEY){keySheet(kind);return}if(busy)return;busy=true;
 document.querySelectorAll('.gen-'+kind).forEach(b=>{b.disabled=true;b.textContent='Creating, about 20 seconds'});
 try{const src=await stability(kind);setImg(kind,await shrink(src));S.stats.gens++;save();busy=false;refreshPhoto();viewImg(kind)}
 catch(e){busy=false;refreshPhoto();sheet(`<h2>The picture was not created</h2><p class="c">${esc(e.message)}</p><button class="btn" onclick="closeSheet()">Close</button>`)}}
async function stability(kind){
 const fd=new FormData(),blob=await(await fetch(IMG.photo)).blob();
 fd.append('image',blob,'photo.jpg');fd.append('prompt',kind==='prog'?progPrompt():avatarPrompt());
 fd.append('negative_prompt',kind==='prog'?'nudity, swimwear, underwear, different person, changed face, extra limbs, cartoon, illustration, dramatic transformation':'nudity, swimwear, photograph, extra limbs, text, watermark');
 fd.append('mode','image-to-image');fd.append('model','sd3.5-large');fd.append('strength',kind==='prog'?'0.55':'0.75');fd.append('output_format','jpeg');
 let res;try{res=await fetch('https://api.stability.ai/v2beta/stable-image/generate/sd3',{method:'POST',headers:{Authorization:'Bearer '+APIKEY,Accept:'application/json'},body:fd})}
 catch(e){throw new Error('FitMe could not reach Stability AI. Check your internet connection and try again.')}
 if(!res.ok){let d='';try{const j=await res.json();d=(j.errors||[]).join('; ')||j.message||''}catch(e){}
  const m={401:'Stability AI did not accept that key. Enter it again in Settings.',402:'Your Stability AI account is out of credits. Add credits at platform.stability.ai.',403:'Stability AI\'s safety filter declined this request. Use a clear, fully dressed photo.',413:'The photo is too large. Choose a smaller one.',429:'Too many requests. Wait a minute and try again.'}[res.status]||`Stability AI returned an error (${res.status}).`;
  if(res.status===401)APIKEY='';throw new Error(m+(d?' Details: '+d:''))}
 const j=await res.json();if(!j.image||j.finish_reason==='CONTENT_FILTERED')throw new Error('Stability AI\'s safety filter declined this picture. Use a clear, fully dressed photo.');
 return'data:image/jpeg;base64,'+j.image}
function keySheet(next){sheet(`<h2>Stability AI key</h2><p class="c">Pictures are created by Stability AI with your own key. FitMe keeps the key in memory only while the app is open and sends it nowhere else.</p><div class="note">Get a key at platform.stability.ai under API keys. Each picture uses about 6.5 credits. Your photo is sent to Stability AI to make the picture and is never shared anywhere else.</div><div class="fld"><label for="sk">API key</label><input id="sk" type="password" placeholder="sk-..." autocomplete="off"></div><label class="tog"><div><b>Show key</b></div><input type="checkbox" onchange="$('sk').type=this.checked?'text':'password'"></label><button class="btn" onclick="saveKey('${next||''}')">Save key</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>`)}
function saveKey(next){const v=$('sk').value.trim();if(!v){cheer('Paste your key first.');return}APIKEY=v;closeSheet();cheer('Key saved until you close FitMe.');if(next)gen(next)}
function viewImg(k){const t=k==='prog'?'Progress picture':'Life-like avatar';
 if(!IMG[k]){if(IMG.photo)gen(k);return}
 sheet(`<h2>${t}</h2><p class="c">${k==='prog'?'What a healthy pace could look like by '+fmt(P().targetDate,{month:'long',year:'numeric'})+'. It is an illustration made by AI, not a promise.':'Made from your picture, dressed in what your avatar is wearing.'}</p><img src="${IMG[k]}" alt="${t}" style="width:100%;border-radius:14px;margin-bottom:8px"><div class="note">This picture is stored only on this device and is never shared.</div><button class="btn gen-${k}" onclick="gen('${k}')">Create again</button><button class="btn ghost" onclick="closeSheet()">Close</button>`)}

/* ================= Settings ================= */
const draft=()=>{D=JSON.parse(JSON.stringify(S.profile))};
const backBtn='<button class="btn ghost" onclick="settings()">Back to settings</button>';
function settings(){const row=(e,t,s,f)=>`<button onclick="${f}"><em>${e}</em><div><b>${t}</b><span>${s}</span></div><u>›</u></button>`;
 sheet(`<h2>Settings</h2><div class="rows">${row('🧍','Profile','Name, age, weight, height, target date','setProfile()')}${row('🎨','Avatar look','Skin, hair and hair colour','setAvatar()')}${row('🌍','World',W().n+'. Changing it keeps all your progress','setWorld()')}${row('🥗','Allergies and food choices',S.profile.allergies.join(', ')||'None selected',"setList('allergies','Allergies and food choices')")}${row('🏃','Activities',S.profile.activities.join(', ')||'None selected',"setList('activities','Activities you like')")}${row('🍩','Temptations',S.profile.temptations.join(', ')||'None selected',"setList('temptations','Your temptations')")}${row('🔔','Notifications and voice','Reminders, and Kit speaking aloud','setNotif()')}${row('🔑','Stability AI key',APIKEY?'Saved until you close FitMe':'Needed to create pictures from your photo','keySheet()')}${row('📷','Photo and pictures','Photo, progress picture, life-like avatar',"closeSheet();go('me')")}${row('🔒','Privacy and data','What is stored, and how to delete it','setPrivacy()')}${row('📊','Usage statistics','Counts kept on this device','setStats()')}</div><button class="btn sec" onclick="closeSheet()">Close</button>`)}
function commit(msg){S.profile=D;save();applyWorld(S.profile.world);closeSheet();refresh();cheer(msg||'Saved. Your progress is unchanged.')}
function setProfile(){draft();sheet(`<h2>Profile</h2><div id="about-host"></div><button class="btn" onclick="saveProfile()">Save changes</button>${backBtn}`);reAbout()}
function saveProfile(){const e=aboutErr();if(e){cheer(e);return}D.name=(D.name||'').trim()||'Friend';if(Math.abs(D.weightLbs-S.profile.weightLbs)>.05){S.weights=S.weights.filter(x=>x.d!==dk());S.weights.push({d:dk(),lbs:D.weightLbs})}commit()}
function setAvatar(){draft();sheet(`<h2>Avatar look</h2><div id="av-host">${avBuildHTML()}</div><button class="btn" onclick="commit()">Save changes</button>${backBtn}`)}
function setWorld(){draft();sheet(`<h2>World</h2><p class="c">Your ${cur()} carry over as the new world's currency, and everything you own stays yours.</p><div id="worlds-host">${worldsHTML()}</div><button class="btn" onclick="commit('World changed. Your progress is unchanged.')">Save changes</button><button class="btn ghost" onclick="applyWorld(S.profile.world);settings()">Back to settings</button>`)}
function setList(key,title){draft();sheet(`<h2>${title}</h2>${chipsHTML(key,LISTS[key])}<button class="btn" onclick="commit()">Save changes</button>${backBtn}`)}
function setNotif(){draft();const np=('Notification'in window)?Notification.permission:'unsupported';
 sheet(`<h2>Notifications and voice</h2><label class="tog"><div><b>Reminders from Kit</b><span>${np==='denied'?'Notifications are blocked for this site in your browser settings.':np==='unsupported'?'This browser shows reminders only while FitMe is open.':'Water, meals and movement, through the day'}</span></div><input type="checkbox" ${D.notif?'checked':''} onchange="D.notif=this.checked;if(this.checked&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission()"></label><label class="tog"><div><b>Kit speaks aloud</b><span>Kit reads its messages to you</span></div><input type="checkbox" ${D.voice?'checked':''} onchange="D.voice=this.checked"></label><button class="btn" onclick="commit()">Save changes</button>${backBtn}`)}
function setPrivacy(){sheet(`<h2>Privacy and data</h2><div class="note">Everything FitMe knows about you is stored in this browser on this device: your profile, progress, photo and pictures. Nothing is uploaded to a FitMe server, and no other user can see it. Your photo leaves the device only when you create a picture, and then it goes only to Stability AI.</div><button class="btn sec" onclick="this.outerHTML='<button class=&quot;btn&quot; style=&quot;background:#c62828;box-shadow:0 4px 0 #8e1c1c&quot; onclick=&quot;wipe()&quot;>Yes, delete everything</button>'">Delete everything on this device</button>${backBtn}`)}
function wipe(){try{localStorage.removeItem(KEY);for(const k in IMG)localStorage.removeItem('fitme.img.'+k)}catch(e){}location.reload()}
function setStats(){const s=S.stats;sheet(`<h2>Usage statistics</h2><table class="earn">${[['Times opened',s.opens],['Steps completed',s.steps],['Messages to Kit',s.kit],['Pictures created',s.gens],['Shop purchases',s.buys],[cur()+' earned in total',num(S.lifetime)]].map(x=>`<tr><td>${x[0]}</td><td style="color:var(--ink)">${x[1]}</td></tr>`).join('')}</table><h3>For testing</h3><button class="btn sec" onclick="S.points+=500;S.lifetime+=500;save();refresh();cheer('Added 500 ${cur()} for testing.')">Add 500 ${cur()}</button>${backBtn}`)}

/* ================= Kit ================= */
const LOG=[];let KQ=[],kitMode=null,recog=null;
function speak(t){if(!S.profile.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FFFF}☀-➿️]/gu,'')))}catch(e){}}
function kitSay(t,q,quiet){LOG.push({w:'k',t,q:q||[]});renderChat();if(!quiet)speak(t)}
function renderChat(){const c=$('chat');KQ=[];c.innerHTML=LOG.map((m,i)=>`<div class="bub ${m.w}">${esc(m.t)}</div>`+(i===LOG.length-1&&m.q.length?'<div class="qr">'+m.q.map(b=>{KQ.push(b);return`<button onclick="kq(${KQ.length-1})">${esc(b[0])}</button>`}).join('')+'</div>':'')).join('');c.scrollTop=c.scrollHeight}
function kq(i){const b=KQ[i];if(!b)return;if(b[2]){window.open(b[2],'_blank','noopener');return}if(b[1]==='water'){quickWater();return}userSays(b[1]||b[0])}
const HOME=[['Going well'],['It is hard today'],['I need a meal idea'],['Exercise is hard for me'],['Find local events']];
function kitOpen(){if(!LOG.length)kitSay(`Hi ${S.profile.name}, I'm Kit. How is today going?`,HOME);else renderChat()}
function kitSend(){const i=$('kit-inp'),t=i.value.trim();if(!t)return;i.value='';userSays(t)}
function userSays(t){LOG.push({w:'u',t,q:[]});S.stats.kit++;save();renderChat();const r=kitReply(t);setTimeout(()=>kitSay(r.t,r.q),450)}
function quickWater(){const r=dayRec(dk()),id=WATER.find(x=>r.done[x]==null);if(id){complete(id,3,'Water logged.','water');kitSay('Lovely. '+FACTS[Math.floor(Math.random()*FACTS.length)],HOME)}else kitSay('You have already logged all 8 glasses today. Wonderful work!',HOME)}
function kitReply(t){const s=t.toLowerCase(),n=S.profile.name,vids=VIDEOS.map(v=>[v[0],'','https://www.youtube.com/results?search_query='+encodeURIComponent(v[1])]);
 if(kitMode==='ingredients'){kitMode=null;return{t:mealFrom(s),q:HOME}}
 if(/meal idea|what (should|can|do) i (eat|cook|make)|not sure what to (eat|cook|make)|recipe|what to (eat|cook|make)|hungry/.test(s)){kitMode='ingredients';const m=mealsFor(dk()).d[dow(dk())];return{t:`How about ${m.toLowerCase()}? It is on your plan today. Or tell me what ingredients you have and I will suggest something healthy from those.`,q:[]}}
 if(/video|youtube/.test(s)||(/exercis|work ?out|gym|moving|active/.test(s)&&/hard|difficult|can'?t|tough|struggl|tired|sore|no time|hate|bor/.test(s)))return{t:'Starting is the hardest part, and a few minutes at home counts. Can I recommend a video? Pick one and it opens in YouTube.',q:vids.concat([['Maybe later','Maybe later']])};
 if(/water|thirsty|hydrat|drink/.test(s))return{t:FACTS[Math.floor(Math.random()*FACTS.length)]+' Would you like a glass of water now?',q:[['I drank a glass','water'],['Not right now','Maybe later']]};
 if(/event|fun run|walking group|5k|local/.test(s))return{t:'Moving with other people makes it easier to keep going. Here are some searches for events near you.',q:[['Fun runs near me','','https://www.google.com/search?q=fun+runs+near+me'],['Walking groups near me','','https://www.google.com/search?q=walking+groups+near+me'],['Thanks, Kit','Thanks']]};
 if(/later|not now|no thanks/.test(s))return{t:'No problem. I am here whenever you want me.',q:HOME};
 if(/thank/.test(s))return{t:`Any time, ${n}. I am glad to be on this path with you.`,q:HOME};
 if(/not (so |very |too |really )?(good|great|well|ok|okay)|bad|hard|difficult|struggl|tough|slip|gave up|give up|fail|stress|tired|sad|awful|terrible|cheat|binge|guilty/.test(s))return{t:'Changing habits can be challenging at first. Is there something specific that you find difficult? One missed step does not undo your progress. We can slow the pace: choose just one stone on your path to finish today, and let that be enough.',q:[['Eating well is hard','I need a meal idea'],['Exercise is hard for me'],['I forget to drink water','I should drink more water'],['Find local events']]};
 if(/good|great|well|awesome|fantastic|amazing|fine|okay|\bok\b|better|proud|did it|nice|happy/.test(s))return{t:"That's great! Keep up the good work! What is the next stone on your path today?",q:HOME};
 if(/^(hi|hello|hey)\b/.test(s))return{t:`Hello, ${n}! How are your meals, movement and water going today?`,q:HOME};
 return{t:'I am listening. I can suggest a meal, find an exercise video, remind you about water, or just cheer you on. How are things going with your healthy habits?',q:HOME}}
function mealFrom(s){const has=r=>r.test(s),al=S.profile.allergies,ok=tag=>!al.some(a=>(ATAG[a]||[]).includes(tag));
 const ideas=[[/egg/,'eggs','a veggie omelette: whisk the eggs, add any vegetables you have, and cook in a little olive oil'],[/chicken|turkey/,'meat','grilled or baked chicken with roasted vegetables and a small portion of whole grains'],[/salmon|tuna|cod|fish/,'fish','baked fish with lemon, a big serving of vegetables, and brown rice or quinoa'],[/tofu/,'soy','a tofu and vegetable stir-fry with brown rice, light on the sauce'],[/bean|lentil|chickpea/,'','a bean and vegetable bowl: warm the beans with spices and serve over greens or brown rice'],[/pasta/,'wheat','whole-wheat pasta tossed with lots of vegetables, garlic and olive oil'],[/rice|quinoa/,'','a grain bowl: rice or quinoa topped with vegetables and beans'],[/yogurt|yoghurt/,'milk','plain yogurt with fruit and a few nuts or seeds']];
 for(const i of ideas)if(has(i[0])&&(!i[1]||ok(i[1])))return`With that, I would make ${i[2]}. Fill half your plate with vegetables and you are right on plan.`;
 return'With what you have, try a simple vegetable stir-fry or a big salad with beans for protein. Fill half your plate with vegetables, keep added salt and sugar low, and you are right on plan.'}
function kitMic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){kitSay('Voice input is not available in this browser, so type to me here. The microphone key on your phone keyboard works too.',[],1);return}
 if(recog){recog.stop();return}
 try{if('speechSynthesis'in window)speechSynthesis.cancel();recog=new R();recog.lang='en-US';recog.interimResults=false;$('mic').classList.add('rec');
  recog.onresult=e=>{$('kit-inp').value=e.results[0][0].transcript;kitSend()};
  recog.onend=()=>{recog=null;$('mic').classList.remove('rec')};
  recog.onerror=e=>{if(e.error==='not-allowed')kitSay('I need microphone permission to hear you. You can allow it in your browser settings, or type to me.',[],1)};
  recog.start()}catch(e){recog=null;$('mic').classList.remove('rec')}}
/* pop-up from Kit with the avatar; buttons are [label, js] */
function kitPop(t,btns){if(!S.onboarded||$('sheet-bg').classList.contains('open'))return;LOG.push({w:'k',t,q:HOME});
 $('kitpop').innerHTML=`<div class="who">${IMG.avatar?`<img src="${IMG.avatar}" alt="">`:avatarSVG({round:1,id:'k'})}</div><div><p><b>Kit:</b> ${esc(t)}</p>${(btns||[]).map(b=>`<button class="btn sm" onclick="closePop();${b[1]}">${b[0]}</button> `).join('')}<button class="btn sm sec" onclick="closePop();go('kit')">Reply</button> <button class="btn sm sec" onclick="closePop()">Not now</button></div>`;
 $('kitpop').classList.add('open');speak(t);
 if(document.hidden&&S.profile.notif&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('Kit from FitMe',{body:t})}catch(e){}}}
function closePop(){$('kitpop').classList.remove('open');try{speechSynthesis.cancel()}catch(e){}}
function lowWater(){const t=dk(),a=addDays(t,-1),b=addDays(t,-2);if(!S.profile.startDate||S.profile.startDate>b)return false;
 return[a,b].reduce((n,k)=>n+(S.days[k]?WATER.filter(x=>S.days[k].done[x]!=null).length:0),0)<8}
function openChecks(){const now=Date.now(),away=S.lastOpen&&now-S.lastOpen>864e5;S.lastOpen=now;S.stats.opens++;save();
 if(away)setTimeout(()=>kitPop(`Welcome back, ${S.profile.name}! I have missed you. How have you been doing?`),800);
 else if(lowWater()&&!dayRec(dk()).wn){dayRec(dk()).wn=1;save();setTimeout(()=>kitPop("It seems it's been a while since you had some water. Would you like a glass now? "+FACTS[Math.floor(Math.random()*FACTS.length)],[['I drank a glass','quickWater()']]),800)}}
let remI=0;
function remind(){if(!S.onboarded||!S.profile.notif)return;const r=dayRec(dk()),wat=WATER.filter(x=>r.done[x]!=null).length,h=new Date().getHours();
 if(h<7||h>21)return;
 if(wat<Math.min(8,Math.floor((h-6)/2)))kitPop('Time for some water? '+FACTS[Math.floor(Math.random()*FACTS.length)],[['I drank a glass','quickWater()']]);
 else kitPop(REMIND[remI++%REMIND.length])}

/* ================= Start ================= */
let today=dk();
if(S.onboarded){enterApp();openChecks()}else startOnboard();
setInterval(remind,45*60*1000);
setInterval(()=>{if(dk()!==today){today=dk();refresh()}},60*1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.lastOpen=Date.now();save()}else if(S.onboarded){today=dk();refresh();openChecks()}});
</script>
